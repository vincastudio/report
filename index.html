<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Report sul campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#132630;
    --ink-soft:#5B6B73;
    --paper:#F5F6F1;
    --panel:#FFFFFF;
    --navy:#0F1F29;
    --amber:#D6A23C;
    --amber-dark:#B9862A;
    --line:#D9DBD3;
    --danger:#B4472F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .app-shell{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:48px;
  }
  .topbar{
    background:var(--navy);
    color:#F5F6F1;
    padding:30px 24px 46px;
  }
  .topbar h1{
    font-family:'Roboto Slab', serif;
    font-weight:700;
    font-size:26px;
    margin:0 0 6px;
    letter-spacing:0.2px;
  }
  .topbar p{
    margin:0;
    font-size:14px;
    color:#B9C2C6;
  }
  .sheet{
    background:var(--panel);
    margin:-26px 16px 28px;
    border-radius:5px;
    box-shadow:0 12px 28px rgba(15,31,41,0.18);
    position:relative;
    overflow:hidden;
  }
  .sheet::before{
    content:'';
    display:block;
    border-top:2px dashed var(--line);
    margin:0 22px;
  }
  .field{
    padding:20px 22px;
    border-bottom:1px solid var(--line);
  }
  .field:last-of-type{ border-bottom:none; }
  .field label{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .field label .count{ font-weight:500; color:var(--ink-soft); font-size:12px; }
  input[type="text"], input[type="date"], textarea{
    width:100%;
    font-family:'Inter',system-ui,sans-serif;
    font-size:16px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:3px;
    padding:12px 14px;
    outline:none;
  }
  input[type="text"]:focus, input[type="date"]:focus, textarea:focus{
    border-color:var(--amber-dark);
  }
  textarea{ min-height:130px; resize:vertical; line-height:1.5; }
  #presenti{ min-height:0; height:76px; }
  .photo-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .thumb-item{
    width:84px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .thumb{
    width:84px; height:84px;
    border-radius:4px;
    overflow:hidden;
    position:relative;
    border:1px solid var(--line);
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb button{
    position:absolute;
    top:3px; right:3px;
    width:22px; height:22px;
    border-radius:50%;
    border:none;
    background:rgba(15,31,41,0.72);
    color:#fff;
    font-size:13px;
    line-height:1;
    cursor:pointer;
  }
  .thumb-num{
    font-size:11px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .thumb-caption{
    width:100%;
    font-size:11px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:3px;
    padding:4px 5px;
    text-align:center;
    font-family:'Inter',system-ui,sans-serif;
  }
  .thumb-caption:focus{ border-color:var(--amber-dark); outline:none; }
  .add-tile{
    width:84px; height:84px;
    border-radius:4px;
    border:2px dashed var(--line);
    background:none;
    color:var(--amber-dark);
    font-size:26px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .add-tile:disabled{ opacity:0.4; cursor:not-allowed; }
  .primary-btn{
    display:block;
    width:calc(100% - 44px);
    margin:22px 22px 0;
    padding:14px 16px;
    background:var(--amber);
    color:var(--navy);
    border:none;
    border-radius:3px;
    font-family:'Inter',system-ui,sans-serif;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .primary-btn:active{ background:var(--amber-dark); }
  .primary-btn:disabled{ background:var(--line); color:#8A9096; cursor:not-allowed; }
  input:focus-visible, textarea:focus-visible, button:focus-visible{
    outline:3px solid var(--navy);
    outline-offset:2px;
  }
  .status{
    margin:14px 22px 22px;
    font-size:13.5px;
    color:var(--ink-soft);
    min-height:18px;
  }
  .status.error{ color:var(--danger); }
  .status.ok{ color:#2E6B4F; }
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <h1>Report sul campo</h1>
    <p>Compila la scheda e genera il PDF riepilogativo</p>
  </header>

  <main class="sheet">
    <section class="field">
      <label for="title">Luogo</label>
      <input type="text" id="title" placeholder="es. Cantiere via Roma">
    </section>

    <section class="field">
      <label for="date">Data del sopralluogo</label>
      <input type="date" id="date">
    </section>

    <section class="field">
      <label for="presenti">Presenti</label>
      <textarea id="presenti" rows="3" placeholder="Nomi delle persone presenti al sopralluogo (facoltativo)"></textarea>
    </section>

    <section class="field">
      <label for="photoInput">Foto <span class="count" id="photoCount">0 di 10</span></label>
      <div class="photo-grid" id="photoGrid">
        <label for="photoInput" class="add-tile" id="addTile" aria-label="Aggiungi foto">+</label>
      </div>
      <input type="file" id="photoInput" accept="image/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;">
    </section>

    <section class="field">
      <label for="notes">Note</label>
      <textarea id="notes" placeholder="Scrivi le tue osservazioni..."></textarea>
    </section>

    <button type="button" class="primary-btn" id="generateBtn">Genera PDF</button>
    <p class="status" id="status" aria-live="polite"></p>
  </main>
</div>

<script>
(function(){
  const dateInput = document.getElementById('date');
  const titleInput = document.getElementById('title');
  const notesInput = document.getElementById('notes');
  const presentiInput = document.getElementById('presenti');
  const photoInput = document.getElementById('photoInput');
  const photoGrid = document.getElementById('photoGrid');
  const photoCount = document.getElementById('photoCount');
  const generateBtn = document.getElementById('generateBtn');
  const statusEl = document.getElementById('status');

  const addTile = document.getElementById('addTile');
  const MAX_PHOTOS = 10;
  let photos = []; // { dataUrl, width, height }

  // --- Data odierna precompilata (calcolata in ora locale, non UTC) ---
  function todayLocalISO(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  dateInput.value = todayLocalISO();

  function formatDateIt(isoStr){
    const [y,m,d] = isoStr.split('-');
    return `${d}/${m}/${y}`;
  }

  // --- Gestione foto ---
  function renderPhotoGrid(){
    photoGrid.querySelectorAll('.thumb-item').forEach(el => el.remove());
    photos.forEach((p, i) => {
      const item = document.createElement('div');
      item.className = 'thumb-item';
      item.innerHTML = `<div class="thumb"><img src="${p.dataUrl}" alt="Foto ${i+1}"><button type="button" aria-label="Rimuovi foto ${i+1}">×</button></div><span class="thumb-num">Foto ${i+1}</span><input type="text" class="thumb-caption" placeholder="Didascalia (facoltativa)" aria-label="Didascalia foto ${i+1}">`;
      item.querySelector('button').addEventListener('click', () => {
        photos.splice(i,1);
        renderPhotoGrid();
      });
      const captionInput = item.querySelector('.thumb-caption');
      captionInput.value = p.caption;
      captionInput.addEventListener('input', (e) => {
        p.caption = e.target.value;
      });
      photoGrid.insertBefore(item, addTile);
    });
    addTile.style.display = photos.length < MAX_PHOTOS ? 'flex' : 'none';
    photoCount.textContent = `${photos.length} di ${MAX_PHOTOS}`;
  }

  function resizeImage(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Lettura file non riuscita'));
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => reject(new Error('Immagine non valida'));
        img.onload = () => {
          const maxSide = 1600;
          let w = img.naturalWidth, h = img.naturalHeight;
          if (w > h && w > maxSide){ h = Math.round(h * (maxSide/w)); w = maxSide; }
          else if (h >= w && h > maxSide){ w = Math.round(w * (maxSide/h)); h = maxSide; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.82), width: w, height: h });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  photoInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    const room = MAX_PHOTOS - photos.length;
    const toAdd = files.slice(0, room);
    if (files.length > room){
      setStatus(`Puoi aggiungere al massimo ${MAX_PHOTOS} foto in totale: sono state prese solo le prime ${room}.`, 'error');
    }
    for (const f of toAdd){
      try{
        const resized = await resizeImage(f);
        photos.push({ ...resized, caption: '' });
      }catch(err){
        setStatus('Una foto non è stata caricata correttamente.', 'error');
      }
    }
    renderPhotoGrid();
    photoInput.value = '';
  });

  renderPhotoGrid();

  // --- Stato ---
  function setStatus(msg, type){
    statusEl.textContent = msg;
    statusEl.className = 'status' + (type ? ' ' + type : '');
  }

  // --- Generazione PDF ---
  generateBtn.addEventListener('click', () => {
    const title = titleInput.value.trim();
    const dateVal = dateInput.value;
    const notes = notesInput.value.trim();
    const presenti = presentiInput.value.trim();

    if (!title){
      setStatus('Inserisci un luogo prima di generare il PDF.', 'error');
      titleInput.focus();
      return;
    }
    if (!dateVal){
      setStatus('Inserisci una data valida.', 'error');
      return;
    }
    if (photos.length === 0){
      setStatus('Aggiungi almeno una foto prima di generare il PDF.', 'error');
      return;
    }

    generateBtn.disabled = true;
    setStatus('Generazione del PDF in corso...');

    setTimeout(() => {
      try{
        const NAVY = [15,31,41];
        const AMBER = [214,162,60];
        const INK = [19,38,48];
        const INK_SOFT = [91,107,115];
        const LINE = [222,224,217];
        const FOOTER_H = 21;

        const COMPANY_NAME = 'GeoTec Studio Associato S.r.l.';
        const COMPANY_ADDRESS = "Via dell'Artigianato 24, 40128 Bologna (BO)";
        const COMPANY_VAT = 'P.IVA 03456789012';
        const COMPANY_WEB = 'www.geotecstudio.it';
        const COMPANY_EMAIL = 'info@geotecstudio.it';
        const COMPANY_INITIALS = 'GT';

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit:'mm', format:'a4' });
        const pageW = doc.internal.pageSize.getWidth();
        const pageH = doc.internal.pageSize.getHeight();
        const margin = 16;
        const maxW = pageW - margin*2;
        const bottomLimit = pageH - FOOTER_H;
        let y;

        function drawLogoBadge(bandH){
          const size = Math.min(16, bandH - 8);
          const bx = pageW - margin - size;
          const by = (bandH - size) / 2;
          doc.setFillColor(...AMBER);
          doc.roundedRect(bx, by, size, size, 2.5, 2.5, 'F');
          doc.setFont('helvetica','bold');
          doc.setFontSize(size * 0.7);
          doc.setTextColor(...NAVY);
          doc.text(COMPANY_INITIALS, bx + size/2, by + size/2 + size*0.24, { align:'center' });
        }

        function drawMainHeader(){
          const bandH = 30;
          doc.setFillColor(...NAVY);
          doc.rect(0, 0, pageW, bandH, 'F');
          doc.setFont('helvetica','bold');
          doc.setFontSize(20);
          doc.setTextColor(255,255,255);
          doc.text('Report in campo', margin, bandH/2 + 3.5);
          drawLogoBadge(bandH);
          doc.setDrawColor(...AMBER);
          doc.setLineWidth(0.8);
          doc.line(0, bandH, pageW, bandH);
          return bandH + 13;
        }

        function drawContinuationHeader(){
          const h = 15;
          doc.setFillColor(...NAVY);
          doc.rect(0, 0, pageW, h, 'F');
          doc.setFont('helvetica','bold');
          doc.setFontSize(11);
          doc.setTextColor(255,255,255);
          doc.text('Report in campo', margin, 10);
          doc.setDrawColor(...AMBER);
          doc.setLineWidth(0.6);
          doc.line(0, h, pageW, h);
          return h + 11;
        }

        function newPage(){
          doc.addPage();
          y = drawContinuationHeader();
        }

        function sectionLabel(text){
          if (y + 12 > bottomLimit) newPage();
          doc.setFont('helvetica','bold');
          doc.setFontSize(11.5);
          doc.setTextColor(...INK_SOFT);
          doc.text(text, margin, y);
          doc.setDrawColor(...LINE);
          doc.setLineWidth(0.4);
          doc.line(margin, y + 2.6, pageW - margin, y + 2.6);
          y += 10;
        }

        function bodyText(text, fontSize){
          doc.setFont('helvetica','normal');
          doc.setFontSize(fontSize || 11);
          doc.setTextColor(...INK);
          const lineH = (fontSize || 11) * 0.55;
          doc.splitTextToSize(text, maxW).forEach(line => {
            if (y + lineH > bottomLimit) newPage();
            doc.text(line, margin, y);
            y += lineH;
          });
        }

        y = drawMainHeader();

        sectionLabel('Luogo');
        bodyText(title);
        y += 6;

        sectionLabel('Data del sopralluogo');
        bodyText(formatDateIt(dateVal));
        y += 6;

        if (presenti){
          sectionLabel('Presenti');
          bodyText(presenti);
          y += 6;
        }

        if (notes){
          sectionLabel('Note');
          bodyText(notes);
          y += 6;
        }

        if (photos.length){
          sectionLabel(`Documentazione fotografica (${photos.length})`);
          const gap = 6;
          const colW = (maxW - gap) / 2;
          const captionGap = 5;
          const capLineH = 4.2;
          const rowGap = 7;

          doc.setFont('helvetica','normal');
          doc.setFontSize(9);

          for (let i = 0; i < photos.length; i += 2){
            const left = photos[i];
            const right = photos[i+1];
            const hL = colW * (left.height / left.width);
            const hR = right ? colW * (right.height / right.width) : 0;
            const rowH = Math.max(hL, hR);

            const leftCapText = `Foto ${i+1}` + (left.caption && left.caption.trim() ? `: ${left.caption.trim()}` : '');
            const leftCapLines = doc.splitTextToSize(leftCapText, colW);
            const rightCapText = right ? (`Foto ${i+2}` + (right.caption && right.caption.trim() ? `: ${right.caption.trim()}` : '')) : '';
            const rightCapLines = right ? doc.splitTextToSize(rightCapText, colW) : [];
            const capBlockH = Math.max(leftCapLines.length, rightCapLines.length, 1) * capLineH;

            if (y + rowH + captionGap + capBlockH + rowGap > bottomLimit) newPage();

            doc.addImage(left.dataUrl, 'JPEG', margin, y, colW, hL);
            doc.setTextColor(...INK_SOFT);
            doc.text(leftCapLines, margin + colW/2, y + hL + captionGap, { align:'center' });

            if (right){
              const xR = margin + colW + gap;
              doc.addImage(right.dataUrl, 'JPEG', xR, y, colW, hR);
              doc.text(rightCapLines, xR + colW/2, y + hR + captionGap, { align:'center' });
            }

            doc.setTextColor(...INK);
            y += rowH + captionGap + capBlockH + rowGap;
          }
        }

        const totalPages = doc.internal.getNumberOfPages();
        for (let p = 1; p <= totalPages; p++){
          doc.setPage(p);
          const lineY = pageH - FOOTER_H + 3;
          doc.setDrawColor(...LINE);
          doc.setLineWidth(0.3);
          doc.line(margin, lineY, pageW - margin, lineY);
          doc.setFont('helvetica','normal');
          doc.setFontSize(7.8);
          doc.setTextColor(...INK_SOFT);
          doc.text(`${COMPANY_NAME} — ${COMPANY_ADDRESS}`, margin, lineY + 5);
          doc.text(`${COMPANY_VAT}  ·  ${COMPANY_WEB}  ·  ${COMPANY_EMAIL}`, margin, lineY + 9.5);
          doc.text(`Pagina ${p} di ${totalPages}`, pageW - margin, lineY + 5, { align:'right' });
        }

        const safeTitle = title.toLowerCase()
          .replace(/[^a-z0-9\s-]/gi,'')
          .trim().replace(/\s+/g,'-')
          .slice(0,40) || 'rapporto';
        doc.save(`${safeTitle}-${dateVal}.pdf`);

        setStatus('PDF generato e scaricato.', 'ok');
      }catch(err){
        setStatus('Si è verificato un errore nella generazione del PDF. Riprova.', 'error');
      }finally{
        generateBtn.disabled = false;
      }
    }, 30);
  });
})();
</script>
</body>
</html>
