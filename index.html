<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Reportage sul campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#132630;
    --ink-soft:#5B6B73;
    --paper:#F5F6F1;
    --panel:#FFFFFF;
    --navy:#0F1F29;
    --amber:#D6A23C;
    --amber-dark:#B9862A;
    --line:#D9DBD3;
    --danger:#B4472F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .app-shell{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:48px;
  }
  .topbar{
    background:var(--navy);
    color:#F5F6F1;
    padding:30px 24px 46px;
  }
  .topbar h1{
    font-family:'Roboto Slab', serif;
    font-weight:700;
    font-size:26px;
    margin:0 0 6px;
    letter-spacing:0.2px;
  }
  .topbar p{
    margin:0;
    font-size:14px;
    color:#B9C2C6;
  }
  .sheet{
    background:var(--panel);
    margin:-26px 16px 28px;
    border-radius:5px;
    box-shadow:0 12px 28px rgba(15,31,41,0.18);
    position:relative;
    overflow:hidden;
  }
  .sheet::before{
    content:'';
    display:block;
    border-top:2px dashed var(--line);
    margin:0 22px;
  }
  .field{
    padding:20px 22px;
    border-bottom:1px solid var(--line);
  }
  .field:last-of-type{ border-bottom:none; }
  .field label{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .field label .count{ font-weight:500; color:var(--ink-soft); font-size:12px; }
  input[type="text"], input[type="date"], textarea{
    width:100%;
    font-family:'Inter',system-ui,sans-serif;
    font-size:16px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:3px;
    padding:12px 14px;
    outline:none;
  }
  input[type="text"]:focus, input[type="date"]:focus, textarea:focus{
    border-color:var(--amber-dark);
  }
  textarea{ min-height:130px; resize:vertical; line-height:1.5; }
  .notes-wrap{ position:relative; }
  .notes-wrap textarea{ padding-right:56px; }
  .mic-btn{
    position:absolute;
    top:8px;
    right:8px;
    width:40px;
    height:40px;
    border-radius:50%;
    border:none;
    background:var(--amber);
    color:var(--navy);
    font-size:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .mic-btn:disabled{ background:var(--line); color:#8A9096; cursor:not-allowed; }
  .mic-btn.recording{
    background:var(--danger);
    color:#fff;
    animation:pulse 1.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .mic-btn.recording{ animation:none; }
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(180,71,47,0.45); }
    70%{ box-shadow:0 0 0 10px rgba(180,71,47,0); }
    100%{ box-shadow:0 0 0 0 rgba(180,71,47,0); }
  }
  .hint{ margin:8px 2px 0; font-size:12.5px; color:var(--ink-soft); }
  .photo-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .thumb{
    width:84px; height:84px;
    border-radius:4px;
    overflow:hidden;
    position:relative;
    border:1px solid var(--line);
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb button{
    position:absolute;
    top:3px; right:3px;
    width:22px; height:22px;
    border-radius:50%;
    border:none;
    background:rgba(15,31,41,0.72);
    color:#fff;
    font-size:13px;
    line-height:1;
    cursor:pointer;
  }
  .add-tile{
    width:84px; height:84px;
    border-radius:4px;
    border:2px dashed var(--line);
    background:none;
    color:var(--amber-dark);
    font-size:26px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .add-tile:disabled{ opacity:0.4; cursor:not-allowed; }
  .primary-btn{
    display:block;
    width:calc(100% - 44px);
    margin:22px 22px 0;
    padding:14px 16px;
    background:var(--amber);
    color:var(--navy);
    border:none;
    border-radius:3px;
    font-family:'Inter',system-ui,sans-serif;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .primary-btn:active{ background:var(--amber-dark); }
  .primary-btn:disabled{ background:var(--line); color:#8A9096; cursor:not-allowed; }
  input:focus-visible, textarea:focus-visible, button:focus-visible{
    outline:3px solid var(--navy);
    outline-offset:2px;
  }
  .status{
    margin:14px 22px 22px;
    font-size:13.5px;
    color:var(--ink-soft);
    min-height:18px;
  }
  .status.error{ color:var(--danger); }
  .status.ok{ color:#2E6B4F; }
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <h1>Reportage sul campo</h1>
    <p>Compila la scheda e genera il PDF riepilogativo</p>
  </header>

  <main class="sheet">
    <section class="field">
      <label for="title">Titolo</label>
      <input type="text" id="title" placeholder="es. Sopralluogo cantiere via Roma">
    </section>

    <section class="field">
      <label for="date">Data</label>
      <input type="date" id="date">
    </section>

    <section class="field">
      <label for="photoInput">Foto <span class="count" id="photoCount">0 di 6</span></label>
      <div class="photo-grid" id="photoGrid">
        <label for="photoInput" class="add-tile" id="addTile" aria-label="Aggiungi foto">+</label>
      </div>
      <input type="file" id="photoInput" accept="image/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;">
    </section>

    <section class="field">
      <label for="notes">Note</label>
      <div class="notes-wrap">
        <textarea id="notes" placeholder="Scrivi le tue osservazioni, oppure usa il microfono..."></textarea>
        <button type="button" class="mic-btn" id="micBtn" title="Dettatura vocale">🎤</button>
      </div>
      <p class="hint" id="micHint"></p>
    </section>

    <button type="button" class="primary-btn" id="generateBtn">Genera PDF</button>
    <p class="status" id="status" aria-live="polite"></p>
  </main>
</div>

<script>
(function(){
  const dateInput = document.getElementById('date');
  const titleInput = document.getElementById('title');
  const notesInput = document.getElementById('notes');
  const photoInput = document.getElementById('photoInput');
  const photoGrid = document.getElementById('photoGrid');
  const photoCount = document.getElementById('photoCount');
  const generateBtn = document.getElementById('generateBtn');
  const statusEl = document.getElementById('status');
  const micBtn = document.getElementById('micBtn');
  const micHint = document.getElementById('micHint');

  const addTile = document.getElementById('addTile');
  const MAX_PHOTOS = 6;
  let photos = []; // { dataUrl, width, height }

  // --- Data odierna precompilata (calcolata in ora locale, non UTC) ---
  function todayLocalISO(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  dateInput.value = todayLocalISO();

  function formatDateIt(isoStr){
    const [y,m,d] = isoStr.split('-');
    return `${d}/${m}/${y}`;
  }

  // --- Gestione foto ---
  function renderPhotoGrid(){
    photoGrid.querySelectorAll('.thumb').forEach(el => el.remove());
    photos.forEach((p, i) => {
      const div = document.createElement('div');
      div.className = 'thumb';
      div.innerHTML = `<img src="${p.dataUrl}" alt="Foto ${i+1}"><button type="button" aria-label="Rimuovi foto ${i+1}">×</button>`;
      div.querySelector('button').addEventListener('click', () => {
        photos.splice(i,1);
        renderPhotoGrid();
      });
      photoGrid.insertBefore(div, addTile);
    });
    addTile.style.display = photos.length < MAX_PHOTOS ? 'flex' : 'none';
    photoCount.textContent = `${photos.length} di ${MAX_PHOTOS}`;
  }

  function resizeImage(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Lettura file non riuscita'));
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => reject(new Error('Immagine non valida'));
        img.onload = () => {
          const maxSide = 1600;
          let w = img.naturalWidth, h = img.naturalHeight;
          if (w > h && w > maxSide){ h = Math.round(h * (maxSide/w)); w = maxSide; }
          else if (h >= w && h > maxSide){ w = Math.round(w * (maxSide/h)); h = maxSide; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.82), width: w, height: h });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  photoInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    const room = MAX_PHOTOS - photos.length;
    const toAdd = files.slice(0, room);
    if (files.length > room){
      setStatus(`Puoi aggiungere al massimo ${MAX_PHOTOS} foto in totale: sono state prese solo le prime ${room}.`, 'error');
    }
    for (const f of toAdd){
      try{
        const resized = await resizeImage(f);
        photos.push(resized);
      }catch(err){
        setStatus('Una foto non è stata caricata correttamente.', 'error');
      }
    }
    renderPhotoGrid();
    photoInput.value = '';
  });

  renderPhotoGrid();

  // --- Dettatura vocale ---
  const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let recording = false;

  if (SpeechRecognitionImpl){
    recognition = new SpeechRecognitionImpl();
    recognition.lang = 'it-IT';
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      let finalText = '';
      for (let i = event.resultIndex; i < event.results.length; i++){
        if (event.results[i].isFinal){
          finalText += event.results[i][0].transcript;
        }
      }
      if (finalText){
        const sep = notesInput.value && !notesInput.value.endsWith(' ') && !notesInput.value.endsWith('\n') ? ' ' : '';
        notesInput.value += sep + finalText.trim() + ' ';
      }
    };
    recognition.onerror = () => {
      recording = false;
      micBtn.classList.remove('recording');
      setStatus('Dettatura interrotta: verifica il permesso per il microfono.', 'error');
    };
    recognition.onend = () => {
      recording = false;
      micBtn.classList.remove('recording');
    };

    micBtn.addEventListener('click', () => {
      if (!recording){
        try{
          recognition.start();
          recording = true;
          micBtn.classList.add('recording');
          setStatus('');
        }catch(err){ /* già avviato */ }
      } else {
        recognition.stop();
      }
    });
  } else {
    micBtn.disabled = true;
    micHint.textContent = 'Dettatura vocale non disponibile in questo browser: usa il microfono della tastiera del telefono.';
  }

  // --- Stato ---
  function setStatus(msg, type){
    statusEl.textContent = msg;
    statusEl.className = 'status' + (type ? ' ' + type : '');
  }

  // --- Generazione PDF ---
  generateBtn.addEventListener('click', () => {
    const title = titleInput.value.trim();
    const dateVal = dateInput.value;
    const notes = notesInput.value.trim();

    if (!title){
      setStatus('Inserisci un titolo prima di generare il PDF.', 'error');
      titleInput.focus();
      return;
    }
    if (!dateVal){
      setStatus('Inserisci una data valida.', 'error');
      return;
    }
    if (photos.length === 0){
      setStatus('Aggiungi almeno una foto prima di generare il PDF.', 'error');
      return;
    }

    generateBtn.disabled = true;
    setStatus('Generazione del PDF in corso...');

    setTimeout(() => {
      try{
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit:'mm', format:'a4' });
        const pageW = doc.internal.pageSize.getWidth();
        const pageH = doc.internal.pageSize.getHeight();
        const margin = 16;
        const maxW = pageW - margin*2;
        let y = margin;

        doc.setFont('helvetica','bold');
        doc.setFontSize(18);
        const titleLines = doc.splitTextToSize(title, maxW);
        doc.text(titleLines, margin, y);
        y += titleLines.length * 7 + 2;

        doc.setFont('helvetica','normal');
        doc.setFontSize(11);
        doc.setTextColor(90,90,90);
        doc.text(`Data: ${formatDateIt(dateVal)}`, margin, y);
        doc.setTextColor(20,20,20);
        y += 6;
        doc.setDrawColor(210,210,210);
        doc.line(margin, y, pageW - margin, y);
        y += 8;

        if (notes){
          doc.setFontSize(12);
          const noteLines = doc.splitTextToSize(notes, maxW);
          const lineH = 6;
          noteLines.forEach(line => {
            if (y + lineH > pageH - margin){ doc.addPage(); y = margin; }
            doc.text(line, margin, y);
            y += lineH;
          });
          y += 6;
        }

        photos.forEach((p, i) => {
          const w = maxW;
          const h = w * (p.height / p.width);
          const captionH = 8;
          if (y + h + captionH > pageH - margin){
            doc.addPage();
            y = margin;
          }
          doc.addImage(p.dataUrl, 'JPEG', margin, y, w, h);
          y += h + 5;
          doc.setFontSize(9);
          doc.setTextColor(120,120,120);
          doc.text(`Foto ${i+1} di ${photos.length}`, margin, y);
          doc.setTextColor(20,20,20);
          y += 8;
        });

        const safeTitle = title.toLowerCase()
          .replace(/[^a-z0-9\s-]/gi,'')
          .trim().replace(/\s+/g,'-')
          .slice(0,40) || 'rapporto';
        doc.save(`${safeTitle}-${dateVal}.pdf`);

        setStatus('PDF generato e scaricato.', 'ok');
      }catch(err){
        setStatus('Si è verificato un errore nella generazione del PDF. Riprova.', 'error');
      }finally{
        generateBtn.disabled = false;
      }
    }, 30);
  });
})();
</script>
</body>
</html>
