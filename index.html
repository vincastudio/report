<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SiteReport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#132630;
    --ink-soft:#5B6B73;
    --paper:#F5F6F1;
    --panel:#FFFFFF;
    --navy:#0F1F29;
    --amber:#D6A23C;
    --amber-dark:#B9862A;
    --line:#D9DBD3;
    --danger:#B4472F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .app-shell{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:48px;
  }
  .topbar{
    background:var(--navy);
    color:#F5F6F1;
    padding:30px 24px 46px;
  }
  .topbar h1{
    font-family:'Roboto Slab', serif;
    font-weight:700;
    font-size:26px;
    margin:0 0 6px;
    letter-spacing:0.2px;
  }
  .topbar p{
    margin:0;
    font-size:14px;
    color:#B9C2C6;
  }
  .sheet{
    background:var(--panel);
    margin:-26px 16px 28px;
    border-radius:5px;
    box-shadow:0 12px 28px rgba(15,31,41,0.18);
    position:relative;
    overflow:hidden;
  }
  .sheet::before{
    content:'';
    display:block;
    border-top:2px dashed var(--line);
    margin:0 22px;
  }
  .field{
    padding:20px 22px;
    border-bottom:1px solid var(--line);
  }
  .field:last-of-type{ border-bottom:none; }
  .field label{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .field label .count{ font-weight:500; color:var(--ink-soft); font-size:12px; }
  input[type="text"], input[type="date"], textarea{
    width:100%;
    font-family:'Inter',system-ui,sans-serif;
    font-size:16px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:3px;
    padding:12px 14px;
    outline:none;
  }
  input[type="text"]:focus, input[type="date"]:focus, textarea:focus{
    border-color:var(--amber-dark);
  }
  input[type="date"]{ text-align:left; display:block; width:100%; max-width:100%; min-width:0; box-sizing:border-box; }
  textarea{ min-height:130px; resize:vertical; line-height:1.5; }
  #presenti{ min-height:0; height:76px; }
  .input-row{ display:flex; gap:8px; align-items:center; }
  .input-row input{ flex:1; min-width:0; }
  .geo-btn{
    flex-shrink:0;
    width:44px; height:44px;
    border-radius:50%;
    border:none;
    background:var(--amber);
    color:var(--navy);
    font-size:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .geo-btn:disabled{ background:var(--line); color:#8A9096; cursor:not-allowed; }
  .map-box{
    margin-top:10px;
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
  }
  .leaflet-map{ width:100%; height:230px; }
  .map-attrib{
    margin:0;
    padding:3px 6px;
    font-size:10px;
    color:var(--ink-soft);
    background:var(--paper);
  }
  .map-attrib a{ color:var(--ink-soft); }
  .hint{ margin:8px 2px 0; font-size:12.5px; color:var(--ink-soft); }
  .hint.error{ color:var(--danger); }
  .hint.ok{ color:#2E6B4F; }
  .photo-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .thumb-item{
    width:84px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .thumb{
    width:84px; height:84px;
    border-radius:4px;
    overflow:hidden;
    position:relative;
    border:1px solid var(--line);
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb button{
    position:absolute;
    top:3px; right:3px;
    width:22px; height:22px;
    border-radius:50%;
    border:none;
    background:rgba(15,31,41,0.72);
    color:#fff;
    font-size:13px;
    line-height:1;
    cursor:pointer;
  }
  .thumb-item.selected .thumb{ border-color:var(--amber-dark); border-width:2px; }
  .thumb-label-btn{
    width:100%;
    font-size:11px;
    color:var(--ink-soft);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:3px;
    padding:4px 5px;
    text-align:center;
    font-family:'Inter',system-ui,sans-serif;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .thumb-label-btn.has-caption{ color:var(--ink); border-color:var(--amber-dark); }
  .caption-editor{
    margin-top:12px;
    padding:12px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:4px;
  }
  .caption-editor label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .caption-editor-row{ display:flex; gap:8px; }
  .caption-editor-row input{ flex:1; min-width:0; }
  .caption-editor-row button{
    flex-shrink:0;
    padding:0 16px;
    background:var(--amber);
    color:var(--navy);
    border:none;
    border-radius:3px;
    font-weight:700;
    font-family:'Inter',system-ui,sans-serif;
    font-size:14px;
    cursor:pointer;
  }
  .add-tile{
    width:84px; height:84px;
    border-radius:4px;
    border:2px dashed var(--line);
    background:none;
    color:var(--amber-dark);
    font-size:26px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .add-tile:disabled{ opacity:0.4; cursor:not-allowed; }
  .primary-btn{
    display:block;
    width:calc(100% - 44px);
    margin:22px 22px 0;
    padding:14px 16px;
    background:var(--amber);
    color:var(--navy);
    border:none;
    border-radius:3px;
    font-family:'Inter',system-ui,sans-serif;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .primary-btn:active{ background:var(--amber-dark); }
  .primary-btn:disabled{ background:var(--line); color:#8A9096; cursor:not-allowed; }
  input:focus-visible, textarea:focus-visible, button:focus-visible{
    outline:3px solid var(--navy);
    outline-offset:2px;
  }
  .status{
    margin:14px 22px 22px;
    font-size:13.5px;
    color:var(--ink-soft);
    min-height:18px;
  }
  .status.error{ color:var(--danger); }
  .status.ok{ color:#2E6B4F; }
  .login-intro{
    padding:20px 22px 4px;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .session-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:14px 22px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .session-bar .session-user{
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .session-right{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .session-right img{
    width:36px; height:36px;
    object-fit:contain;
    border-radius:3px;
    background:#fff;
    border:1px solid var(--line);
  }
  .logout-btn{
    flex-shrink:0;
    border:1px solid var(--line);
    background:none;
    color:var(--ink-soft);
    font-family:'Inter',system-ui,sans-serif;
    font-size:12.5px;
    font-weight:600;
    padding:7px 12px;
    border-radius:3px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <h1>SiteReport</h1>
    <p>Compila la scheda e genera il PDF riepilogativo</p>
  </header>

  <main class="sheet">
    <div id="loginScreen">
      <p class="login-intro">Accedi con le tue credenziali per iniziare.</p>
      <section class="field">
        <label for="loginUsername">Nome utente</label>
        <input type="text" id="loginUsername" placeholder="Nome utente" autocomplete="username">
      </section>
      <section class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
      </section>
      <button type="button" class="primary-btn" id="loginBtn">Accedi</button>
      <p class="status" id="loginStatus" aria-live="polite"></p>
    </div>

    <div id="appContent" hidden>
      <div class="session-bar">
        <span class="session-user" id="sessionUser"></span>
        <div class="session-right">
          <img id="companyLogoImg" alt="Logo società" hidden>
          <button type="button" class="logout-btn" id="logoutBtn">Esci</button>
        </div>
      </div>

      <section class="field">
        <label for="title">Luogo</label>
        <div class="input-row">
          <input type="text" id="title" placeholder="es. Via Enzo Ferrari 3, Bologna (BO)">
          <button type="button" id="geoBtn" class="geo-btn" title="Usa posizione attuale" aria-label="Usa posizione attuale">📍</button>
        </div>
        <div class="map-box" id="mapBox" hidden>
          <div id="leafletMap" class="leaflet-map"></div>
          <p class="map-attrib">Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community</p>
        </div>
        <p class="hint" id="geoStatus"></p>
      </section>

      <section class="field">
        <label for="date">Data del sopralluogo</label>
        <input type="date" id="date">
      </section>

      <section class="field">
        <label for="presenti">Presenti</label>
        <textarea id="presenti" rows="3" placeholder="Nomi delle persone presenti al sopralluogo (facoltativo)"></textarea>
      </section>

      <section class="field">
        <label for="photoInput">Foto <span class="count" id="photoCount">0 di 10</span></label>
        <div class="photo-grid" id="photoGrid">
          <label for="photoInput" class="add-tile" id="addTile" aria-label="Aggiungi foto">+</label>
        </div>
        <input type="file" id="photoInput" accept="image/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;">
        <div class="caption-editor" id="captionEditor" hidden>
          <label for="captionEditorInput" id="captionEditorLabel">Didascalia</label>
          <div class="caption-editor-row">
            <input type="text" id="captionEditorInput" placeholder="Didascalia (facoltativa)">
            <button type="button" id="captionEditorDone">Fatto</button>
          </div>
        </div>
      </section>

      <section class="field">
        <label for="notes">Note</label>
        <textarea id="notes" placeholder="Scrivi le tue osservazioni..."></textarea>
      </section>

      <button type="button" class="primary-btn" id="generateBtn">Genera PDF</button>
      <p class="status" id="status" aria-live="polite"></p>
    </div>
  </main>
</div>

<script>
(function(){
  const dateInput = document.getElementById('date');
  const titleInput = document.getElementById('title');
  const notesInput = document.getElementById('notes');
  const presentiInput = document.getElementById('presenti');
  const photoInput = document.getElementById('photoInput');
  const photoGrid = document.getElementById('photoGrid');
  const photoCount = document.getElementById('photoCount');
  const generateBtn = document.getElementById('generateBtn');
  const statusEl = document.getElementById('status');
  const geoBtn = document.getElementById('geoBtn');
  const mapBox = document.getElementById('mapBox');
  const geoStatus = document.getElementById('geoStatus');

  const loginScreen = document.getElementById('loginScreen');
  const appContent = document.getElementById('appContent');
  const loginUsernameInput = document.getElementById('loginUsername');
  const loginPasswordInput = document.getElementById('loginPassword');
  const loginBtn = document.getElementById('loginBtn');
  const loginStatus = document.getElementById('loginStatus');
  const sessionUser = document.getElementById('sessionUser');
  const companyLogoImg = document.getElementById('companyLogoImg');
  const logoutBtn = document.getElementById('logoutBtn');

  const LOGIN_WEBHOOK_URL = 'https://n8n.srv1194647.hstgr.cloud/webhook/sitereport-login';
  const LOG_WEBHOOK_URL = 'https://n8n.srv1194647.hstgr.cloud/webhook/sitereport-event';

  let session = null; // { username, companyName, address, vat, website, email, logoUrl }
  let logoPdfData = null; // { dataUrl, width, height } — logo pronto per il PDF, se caricato con successo

  const addTile = document.getElementById('addTile');
  const captionEditor = document.getElementById('captionEditor');
  const captionEditorLabel = document.getElementById('captionEditorLabel');
  const captionEditorInput = document.getElementById('captionEditorInput');
  const captionEditorDone = document.getElementById('captionEditorDone');
  const MAX_PHOTOS = 10;
  let photos = []; // { dataUrl, width, height }
  let selectedPhotoIndex = null;

  // --- Data odierna precompilata (calcolata in ora locale, non UTC) ---
  function todayLocalISO(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  dateInput.value = todayLocalISO();

  function formatDateIt(isoStr){
    const [y,m,d] = isoStr.split('-');
    return `${d}/${m}/${y}`;
  }

  function extractComune(luogo){
    if (!luogo) return '';
    let s = luogo;
    const commaIdx = s.lastIndexOf(',');
    if (commaIdx !== -1) s = s.slice(commaIdx + 1);
    const parenIdx = s.indexOf('(');
    if (parenIdx !== -1) s = s.slice(0, parenIdx);
    return s.trim();
  }

  function truncateCaption(text, maxLen){
    if (text.length <= maxLen) return text;
    return text.slice(0, maxLen - 1).trimEnd() + '…';
  }

  function thumbLabelText(i, caption){
    const trimmed = (caption || '').trim();
    return trimmed ? `Foto ${i+1}: ${truncateCaption(trimmed, 16)}` : `Foto ${i+1}`;
  }

  function closeCaptionEditor(){
    selectedPhotoIndex = null;
    captionEditor.hidden = true;
    photoGrid.querySelectorAll('.thumb-item.selected').forEach(el => el.classList.remove('selected'));
  }

  function openCaptionEditor(i){
    selectedPhotoIndex = i;
    photoGrid.querySelectorAll('.thumb-item').forEach(el => {
      el.classList.toggle('selected', Number(el.dataset.index) === i);
    });
    captionEditorLabel.textContent = `Didascalia — Foto ${i+1}`;
    captionEditorInput.value = photos[i].caption;
    captionEditor.hidden = false;
    captionEditorInput.focus();
  }

  captionEditorInput.addEventListener('input', (e) => {
    if (selectedPhotoIndex === null) return;
    photos[selectedPhotoIndex].caption = e.target.value;
    const btn = photoGrid.querySelector(`.thumb-item[data-index="${selectedPhotoIndex}"] .thumb-label-btn`);
    if (btn){
      btn.textContent = thumbLabelText(selectedPhotoIndex, e.target.value);
      btn.classList.toggle('has-caption', !!e.target.value.trim());
    }
  });

  captionEditorDone.addEventListener('click', closeCaptionEditor);

  // --- Login, sessione e log azioni (n8n) ---
  function setLoginStatus(msg, type){
    loginStatus.textContent = msg;
    loginStatus.className = 'status' + (type ? ' ' + type : '');
  }

  function companyInitials(name){
    if (!name) return 'SR';
    const words = name.trim().split(/\s+/).filter(w => w.length > 1);
    const initials = ((words[0] || '')[0] || '') + ((words[1] || '')[0] || '');
    return (initials || 'SR').toUpperCase();
  }

  function loadLogoForPdf(url){
    logoPdfData = null;
    if (!url) return;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try{
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        logoPdfData = { dataUrl: canvas.toDataURL('image/png'), width: img.naturalWidth, height: img.naturalHeight };
      }catch(e){
        logoPdfData = null; // canvas "tainted" per CORS: nel PDF si userà il badge con iniziali
      }
    };
    img.onerror = () => { logoPdfData = null; };
    img.src = url;
  }

  function logAction(action){
    if (!session) return;
    const payload = JSON.stringify({
      username: session.username,
      datetime: new Date().toISOString(),
      event: action
    });
    if (!LOG_WEBHOOK_URL) return;
    try{
      if ('sendBeacon' in navigator){
        const blob = new Blob([payload], { type: 'text/plain;charset=UTF-8' });
        if (navigator.sendBeacon(LOG_WEBHOOK_URL, blob)) return;
      }
      fetch(LOG_WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        keepalive: true,
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: payload
      }).catch(() => { /* il logging non deve mai bloccare l'uso dell'app */ });
    }catch(e){
      // il logging non deve mai bloccare l'uso dell'app
    }
  }

  function onLoginSuccess(){
    loginScreen.hidden = true;
    appContent.hidden = false;
    sessionUser.textContent = `Utente: ${session.username}`;
    if (session.logoUrl){
      companyLogoImg.src = session.logoUrl;
      companyLogoImg.hidden = false;
      companyLogoImg.onerror = () => { companyLogoImg.hidden = true; };
      loadLogoForPdf(session.logoUrl);
    } else {
      companyLogoImg.hidden = true;
    }
    logAction('login');
  }

  async function attemptLogin(){
    const username = loginUsernameInput.value.trim();
    const password = loginPasswordInput.value;
    if (!username || !password){
      setLoginStatus('Inserisci nome utente e password.', 'error');
      return;
    }
    loginBtn.disabled = true;
    setLoginStatus('Accesso in corso...');
    try{
      const resp = await fetch(LOGIN_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({ username, password })
      });
      if (!resp.ok) throw new Error('Risposta non valida dal server');
      const data = await resp.json();
      if (data && data.success){
        session = {
          username: data.username || username,
          companyName: data.companyName || '',
          address: data.address || '',
          vat: data.vat || '',
          website: data.website || '',
          email: data.email || '',
          logoUrl: data.logoUrl || ''
        };
        setLoginStatus('');
        onLoginSuccess();
      } else {
        setLoginStatus((data && data.message) || 'Nome utente o password non corretti.', 'error');
      }
    }catch(err){
      setLoginStatus('Impossibile contattare il servizio di accesso. Controlla la connessione e riprova.', 'error');
    }finally{
      loginBtn.disabled = false;
    }
  }

  loginBtn.addEventListener('click', attemptLogin);
  [loginUsernameInput, loginPasswordInput].forEach(el => {
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
  });

  logoutBtn.addEventListener('click', () => {
    session = null;
    logoPdfData = null;
    appContent.hidden = true;
    loginScreen.hidden = false;
    loginPasswordInput.value = '';
    loginUsernameInput.focus();
  });

  // --- Gestione foto ---
  function renderPhotoGrid(){
    closeCaptionEditor();
    photoGrid.querySelectorAll('.thumb-item').forEach(el => el.remove());
    photos.forEach((p, i) => {
      const item = document.createElement('div');
      item.className = 'thumb-item';
      item.dataset.index = i;
      item.innerHTML = `<div class="thumb"><img src="${p.dataUrl}" alt="Foto ${i+1}"><button type="button" aria-label="Rimuovi foto ${i+1}">×</button></div><button type="button" class="thumb-label-btn${p.caption && p.caption.trim() ? ' has-caption' : ''}" aria-label="Modifica didascalia foto ${i+1}">${thumbLabelText(i, p.caption)}</button>`;
      item.querySelector('.thumb button').addEventListener('click', () => {
        photos.splice(i,1);
        renderPhotoGrid();
      });
      item.querySelector('.thumb-label-btn').addEventListener('click', () => {
        openCaptionEditor(i);
      });
      photoGrid.insertBefore(item, addTile);
    });
    addTile.style.display = photos.length < MAX_PHOTOS ? 'flex' : 'none';
    photoCount.textContent = `${photos.length} di ${MAX_PHOTOS}`;
  }

  function resizeImage(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Lettura file non riuscita'));
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => reject(new Error('Immagine non valida'));
        img.onload = () => {
          const maxSide = 1600;
          let w = img.naturalWidth, h = img.naturalHeight;
          if (w > h && w > maxSide){ h = Math.round(h * (maxSide/w)); w = maxSide; }
          else if (h >= w && h > maxSide){ w = Math.round(w * (maxSide/h)); h = maxSide; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.82), width: w, height: h });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  photoInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    const room = MAX_PHOTOS - photos.length;
    const toAdd = files.slice(0, room);
    if (files.length > room){
      setStatus(`Puoi aggiungere al massimo ${MAX_PHOTOS} foto in totale: sono state prese solo le prime ${room}.`, 'error');
    }
    for (const f of toAdd){
      try{
        const resized = await resizeImage(f);
        photos.push({ ...resized, caption: '' });
      }catch(err){
        setStatus('Una foto non è stata caricata correttamente.', 'error');
      }
    }
    renderPhotoGrid();
    photoInput.value = '';
  });

  renderPhotoGrid();

  // --- Geolocalizzazione e mappa ---
  let leafletMapInstance = null;
  let leafletMarker = null;
  let lastGeoCoords = null;

  function setGeoStatus(msg, type){
    geoStatus.innerHTML = msg;
    geoStatus.className = 'hint' + (type ? ' ' + type : '');
  }

  function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent); }
  function isAndroid(){ return /Android/.test(navigator.userAgent); }

  const MANUAL_FALLBACK = ' In alternativa, scrivi il luogo direttamente nel campo qui sopra, oppure copialo da un\'app di mappe (Google Maps, Apple Maps...).';

  function deniedInstructions(){
    let steps;
    if (isIOS()){
      steps = 'Su iPhone: apri Impostazioni → Privacy e sicurezza → Localizzazione e verifica che sia attiva; poi Impostazioni → Safari → Localizzazione → "Chiedi" o "Consenti". Se il sito era già stato bloccato in precedenza, in Safari tocca "AA" nella barra degli indirizzi → Impostazioni sito web → Localizzazione → Consenti, poi ricarica la pagina.';
    } else if (isAndroid()){
      steps = 'Su Android: apri Impostazioni del telefono → App → il browser che usi (es. Chrome) → Autorizzazioni → Posizione → consenti. Se il sito era già stato bloccato, tocca l\'icona del lucchetto nella barra degli indirizzi → Autorizzazioni sito → Posizione → Consenti, poi ricarica la pagina.';
    } else {
      steps = 'Controlla le autorizzazioni del sito toccando l\'icona del lucchetto (o "AA") nella barra degli indirizzi e assicurati che la localizzazione sia consentita, poi ricarica la pagina.';
    }
    return 'Il permesso di localizzazione risulta bloccato. ' + steps + MANUAL_FALLBACK;
  }

  function showMap(lat, lon){
    lastGeoCoords = { lat, lon };
    mapBox.hidden = false;
    if (!leafletMapInstance){
      leafletMapInstance = L.map('leafletMap', { zoomControl:true, attributionControl:false }).setView([lat,lon], 18);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom:19,
        attribution:'Tiles &copy; Esri'
      }).addTo(leafletMapInstance);
      leafletMarker = L.marker([lat,lon]).addTo(leafletMapInstance);
    } else {
      leafletMapInstance.setView([lat,lon], 18);
      leafletMarker.setLatLng([lat,lon]);
    }
    setTimeout(() => leafletMapInstance.invalidateSize(), 100);
  }

  function formatAddress(addr){
    if (!addr) return '';
    const road = addr.road || addr.pedestrian || addr.footway || addr.residential || '';
    const houseNumber = addr.house_number || '';
    const city = addr.city || addr.town || addr.village || addr.municipality || addr.hamlet || '';
    let province = '';
    const isoLvl6 = addr['ISO3166-2-lvl6'];
    if (isoLvl6 && isoLvl6.indexOf('IT-') === 0){
      province = isoLvl6.slice(3);
    } else {
      province = addr.county || addr.state_district || '';
    }
    const streetPart = [road, houseNumber].filter(Boolean).join(' ');
    const cityPart = province ? `${city} (${province})` : city;
    return [streetPart, cityPart].filter(Boolean).join(', ');
  }

  function onGeoError(err){
    geoBtn.disabled = false;
    let msg;
    switch(err.code){
      case err.PERMISSION_DENIED:
        msg = deniedInstructions();
        break;
      case err.POSITION_UNAVAILABLE:
        msg = 'Posizione non disponibile al momento. Riprova, magari all\'aperto.' + MANUAL_FALLBACK;
        break;
      case err.TIMEOUT:
        msg = 'Rilevamento della posizione troppo lento. Riprova.' + MANUAL_FALLBACK;
        break;
      default:
        msg = 'Non sono riuscito a rilevare la posizione.' + MANUAL_FALLBACK;
    }
    setGeoStatus(msg, 'error');
  }

  async function onGeoSuccess(pos){
    const { latitude, longitude } = pos.coords;
    showMap(latitude, longitude);
    setGeoStatus('Posizione rilevata. Recupero indirizzo...');
    try{
      const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`, {
        headers: { 'Accept-Language': 'it' }
      });
      if (!resp.ok) throw new Error('reverse geocoding fallito');
      const data = await resp.json();
      const formatted = formatAddress(data.address);
      if (formatted){
        titleInput.value = formatted;
        setGeoStatus('Luogo compilato automaticamente dalla posizione: controllalo e correggilo se serve.', 'ok');
      } else {
        setGeoStatus('Posizione rilevata, ma non sono riuscito a ricavarne un indirizzo leggibile. Scrivi il luogo manualmente.', 'error');
      }
    }catch(err){
      setGeoStatus('Posizione rilevata, ma il recupero dell\'indirizzo è fallito (verifica la connessione). Scrivi il luogo manualmente.', 'error');
    }finally{
      geoBtn.disabled = false;
    }
  }

  geoBtn.addEventListener('click', async () => {
    if (!('geolocation' in navigator)){
      setGeoStatus('Geolocalizzazione non disponibile su questo dispositivo o browser.' + MANUAL_FALLBACK, 'error');
      return;
    }
    if (!window.isSecureContext){
      setGeoStatus('La geolocalizzazione richiede che la pagina sia aperta da un indirizzo web sicuro (https), non da file locale.' + MANUAL_FALLBACK, 'error');
      return;
    }

    if (navigator.permissions && navigator.permissions.query){
      try{
        const status = await navigator.permissions.query({ name: 'geolocation' });
        if (status.state === 'denied'){
          setGeoStatus(deniedInstructions(), 'error');
          return;
        }
      }catch(e){ /* API non supportata per "geolocation" su questo browser: si procede comunque */ }
    }

    geoBtn.disabled = true;
    setGeoStatus('Rilevamento della posizione in corso...');
    navigator.geolocation.getCurrentPosition(onGeoSuccess, onGeoError, {
      enableHighAccuracy: true,
      timeout: 12000,
      maximumAge: 0
    });
  });

  // --- Stato ---
  function setStatus(msg, type){
    statusEl.textContent = msg;
    statusEl.className = 'status' + (type ? ' ' + type : '');
  }

  // --- Generazione PDF ---
  generateBtn.addEventListener('click', async () => {
    const title = titleInput.value.trim();
    const dateVal = dateInput.value;
    const notes = notesInput.value.trim();
    const presenti = presentiInput.value.trim();

    if (!title){
      setStatus('Inserisci un luogo prima di generare il PDF.', 'error');
      titleInput.focus();
      return;
    }
    if (!dateVal){
      setStatus('Inserisci una data valida.', 'error');
      return;
    }

    generateBtn.disabled = true;
    setStatus('Generazione del PDF in corso...');
    logAction('generate_pdf');

    await new Promise(resolve => setTimeout(resolve, 30));

    let mapCapture = null;
    if (!mapBox.hidden && leafletMapInstance && typeof html2canvas === 'function'){
      const zoomEl = document.querySelector('#leafletMap .leaflet-control-zoom');
      const zoomPrevDisplay = zoomEl ? zoomEl.style.display : null;
      if (zoomEl) zoomEl.style.display = 'none';
      try{
        const canvas = await html2canvas(document.getElementById('leafletMap'), {
          useCORS: true,
          allowTaint: false,
          logging: false
        });
        mapCapture = { dataUrl: canvas.toDataURL('image/jpeg', 0.85), width: canvas.width, height: canvas.height };
      }catch(e){
        mapCapture = null; // fallback a testo/coordinate più sotto
      }finally{
        if (zoomEl) zoomEl.style.display = zoomPrevDisplay || '';
      }
    }

    try{
        const NAVY = [15,31,41];
        const AMBER = [214,162,60];
        const AMBER_DARK = [185,134,42];
        const HEADER_BG = [228,239,227];
        const INK = [19,38,48];
        const INK_SOFT = [91,107,115];
        const LINE = [222,224,217];
        const FOOTER_H = 21;

        const COMPANY_NAME = (session && session.companyName) || '';
        const COMPANY_ADDRESS = (session && session.address) || '';
        const COMPANY_VAT = (session && session.vat) || '';
        const COMPANY_WEB = (session && session.website) || '';
        const COMPANY_EMAIL = (session && session.email) || '';

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit:'mm', format:'a4' });
        const pageW = doc.internal.pageSize.getWidth();
        const pageH = doc.internal.pageSize.getHeight();
        const margin = 16;
        const maxW = pageW - margin*2;
        const bottomLimit = pageH - FOOTER_H;
        let y;

        function drawLogoBadge(bandH){
          const size = Math.min(16, bandH - 8);
          const bx = pageW - margin - size;
          const by = (bandH - size) / 2;
          if (logoPdfData){
            const ratio = logoPdfData.width / logoPdfData.height;
            let w = size, h = size;
            if (ratio > 1){ h = size / ratio; } else { w = size * ratio; }
            doc.addImage(logoPdfData.dataUrl, 'PNG', bx + (size - w) / 2, by + (size - h) / 2, w, h);
          } else {
            doc.setFillColor(...NAVY);
            doc.roundedRect(bx, by, size, size, 2.5, 2.5, 'F');
            doc.setFont('helvetica','bold');
            doc.setFontSize(size * 0.7);
            doc.setTextColor(255,255,255);
            doc.text(companyInitials(COMPANY_NAME), bx + size/2, by + size/2 + size*0.24, { align:'center' });
          }
        }

        function drawMainHeader(){
          const bandH = 30;
          doc.setFillColor(...HEADER_BG);
          doc.rect(0, 0, pageW, bandH, 'F');
          doc.setFont('helvetica','bold');
          doc.setFontSize(20);
          doc.setTextColor(...NAVY);
          doc.text('Report in campo', margin, bandH/2 + 3.5);
          drawLogoBadge(bandH);
          doc.setDrawColor(...AMBER);
          doc.setLineWidth(0.8);
          doc.line(0, bandH, pageW, bandH);
          return bandH + 13;
        }

        function drawContinuationHeader(){
          const h = 15;
          doc.setFillColor(...HEADER_BG);
          doc.rect(0, 0, pageW, h, 'F');
          doc.setFont('helvetica','bold');
          doc.setFontSize(11);
          doc.setTextColor(...NAVY);
          doc.text('Report in campo', margin, 10);
          doc.setDrawColor(...AMBER);
          doc.setLineWidth(0.6);
          doc.line(0, h, pageW, h);
          return h + 11;
        }

        function newPage(){
          doc.addPage();
          y = drawContinuationHeader();
        }

        function sectionLabel(text){
          if (y + 12 > bottomLimit) newPage();
          doc.setFont('helvetica','bold');
          doc.setFontSize(11.5);
          doc.setTextColor(...INK_SOFT);
          doc.text(text, margin, y);
          doc.setDrawColor(...LINE);
          doc.setLineWidth(0.4);
          doc.line(margin, y + 2.6, pageW - margin, y + 2.6);
          y += 10;
        }

        function bodyText(text, fontSize){
          doc.setFont('helvetica','normal');
          doc.setFontSize(fontSize || 11);
          doc.setTextColor(...INK);
          const lineH = (fontSize || 11) * 0.55;
          doc.splitTextToSize(text, maxW).forEach(line => {
            if (y + lineH > bottomLimit) newPage();
            doc.text(line, margin, y);
            y += lineH;
          });
        }

        y = drawMainHeader();

        sectionLabel('Luogo');
        bodyText(title);
        y += 4;

        if (mapCapture){
          let drawW = maxW;
          let drawH = drawW * (mapCapture.height / mapCapture.width);
          if (drawH > 70){ drawH = 70; drawW = drawH * (mapCapture.width / mapCapture.height); }
          const xOffset = margin + (maxW - drawW) / 2;
          if (y + drawH + 10 > bottomLimit) newPage();
          doc.addImage(mapCapture.dataUrl, 'JPEG', xOffset, y, drawW, drawH);
          y += drawH + 4;
          doc.setFont('helvetica','normal');
          doc.setFontSize(8);
          doc.setTextColor(...INK_SOFT);
          const attribLines = doc.splitTextToSize('Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, GIS User Community', maxW);
          doc.text(attribLines, margin, y);
          y += attribLines.length * 3.6 + 3;
        } else if (lastGeoCoords){
          if (y + 14 > bottomLimit) newPage();
          doc.setFont('helvetica','normal');
          doc.setFontSize(9.5);
          doc.setTextColor(...INK_SOFT);
          doc.text(`Posizione GPS: ${lastGeoCoords.lat.toFixed(5)}, ${lastGeoCoords.lon.toFixed(5)}`, margin, y);
          y += 5.5;
          doc.setTextColor(...AMBER_DARK);
          doc.textWithLink('Vedi su OpenStreetMap', margin, y, {
            url: `https://www.openstreetmap.org/?mlat=${lastGeoCoords.lat}&mlon=${lastGeoCoords.lon}#map=18/${lastGeoCoords.lat}/${lastGeoCoords.lon}`
          });
          y += 8;
        }
        y += 2;

        sectionLabel('Data del sopralluogo');
        bodyText(formatDateIt(dateVal));
        y += 6;

        if (presenti){
          sectionLabel('Presenti');
          bodyText(presenti);
          y += 6;
        }

        if (notes){
          sectionLabel('Note');
          bodyText(notes);
          y += 6;
        }

        if (photos.length){
          newPage();
          sectionLabel(`Documentazione fotografica (${photos.length})`);
          const gap = 6;
          const colW = (maxW - gap) / 2;
          const captionGap = 5;
          const capLineH = 4.2;
          const rowGap = 7;

          doc.setFont('helvetica','normal');
          doc.setFontSize(9);

          for (let i = 0; i < photos.length; i += 2){
            const left = photos[i];
            const right = photos[i+1];
            const hL = colW * (left.height / left.width);
            const hR = right ? colW * (right.height / right.width) : 0;
            const rowH = Math.max(hL, hR);

            const leftCapText = `Foto ${i+1}` + (left.caption && left.caption.trim() ? `: ${left.caption.trim()}` : '');
            const leftCapLines = doc.splitTextToSize(leftCapText, colW);
            const rightCapText = right ? (`Foto ${i+2}` + (right.caption && right.caption.trim() ? `: ${right.caption.trim()}` : '')) : '';
            const rightCapLines = right ? doc.splitTextToSize(rightCapText, colW) : [];
            const capBlockH = Math.max(leftCapLines.length, rightCapLines.length, 1) * capLineH;

            if (y + rowH + captionGap + capBlockH + rowGap > bottomLimit) newPage();

            doc.addImage(left.dataUrl, 'JPEG', margin, y, colW, hL);
            doc.setTextColor(...INK_SOFT);
            doc.text(leftCapLines, margin + colW/2, y + hL + captionGap, { align:'center' });

            if (right){
              const xR = margin + colW + gap;
              doc.addImage(right.dataUrl, 'JPEG', xR, y, colW, hR);
              doc.text(rightCapLines, xR + colW/2, y + hR + captionGap, { align:'center' });
            }

            doc.setTextColor(...INK);
            y += rowH + captionGap + capBlockH + rowGap;
          }
        }

        const totalPages = doc.internal.getNumberOfPages();
        for (let p = 1; p <= totalPages; p++){
          doc.setPage(p);
          const lineY = pageH - FOOTER_H + 3;
          doc.setDrawColor(...LINE);
          doc.setLineWidth(0.3);
          doc.line(margin, lineY, pageW - margin, lineY);
          doc.setFont('helvetica','normal');
          doc.setFontSize(7.8);
          doc.setTextColor(...INK_SOFT);
          const footerLine1 = [COMPANY_NAME, COMPANY_ADDRESS].filter(Boolean).join(' — ');
          const footerLine2 = [COMPANY_VAT, COMPANY_WEB, COMPANY_EMAIL].filter(Boolean).join('  ·  ');
          if (footerLine1) doc.text(footerLine1, margin, lineY + 5);
          if (footerLine2) doc.text(footerLine2, margin, lineY + 9.5);
          doc.text(`Pagina ${p} di ${totalPages}`, pageW - margin, lineY + 5, { align:'right' });
        }

        const comuneRaw = extractComune(title) || title;
        const comune = comuneRaw.replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, ' ').trim() || 'Luogo';
        const dateDots = formatDateIt(dateVal).replace(/\//g, '.');
        doc.save(`Report ${comune} ${dateDots}.pdf`);

        setStatus('PDF generato e scaricato.', 'ok');
      }catch(err){
        setStatus('Si è verificato un errore nella generazione del PDF. Riprova.', 'error');
      }finally{
        generateBtn.disabled = false;
      }
  });
})();
</script>
</body>
</html>
